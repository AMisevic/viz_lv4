<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery.min.js"></script>
    <script src="http://d3js.org/d3.v3.min.js"></script>
    <title>LV4</title>
</head>
<body>
<script>
    var width = 1000;
    var height = 1000;
    var outerRadius = 400;
    var innerRadius = 0;

    var color = d3.scale.category20();

    var arc = d3.svg.arc()
    .innerRadius(innerRadius)
    .outerRadius(outerRadius);

    var labelArc = d3.svg.arc()
    .innerRadius(outerRadius * 1.2)
    .outerRadius(outerRadius * 1.2);

    var data = [
    {name: 'jabuka', value: 17},
    {name: 'kruska', value: 4},
    {name: 'banana', value: 83},
    {name: 'jagoda', value: 47},
    {name: 'ribizla', value: 1}
];

    var pie = d3.layout.pie()
    .value(function(d) { return d.value; });

    var svg = d3.select("body")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

    var pieArcs = svg.selectAll("g.pie")
    .data(pie(data))
    .enter()
    .append("g")
    .attr("class", "pie")
    .attr("transform", "translate(" + (width / 2) + ", " + (height / 2) + ")");

    pieArcs.append("path")
    .attr("fill", function(d, i) { return color(i); })
    .attr("d", arc);

    pieArcs.append("path")
    .attr("fill", function(d, i) { return color(i); })
    .attr("d", arc)
    .on("click", function(d) {
        console.log("Clicked segment: " + d.data.name + " (" + d.data.value + ")");
    });

    pieArcs.append("text")
    .attr("transform", function(d) { return "translate(" + arc.centroid(d) + ")"; }) .attr("text-anchor", "middle")
    .text(function(d) { return d.value; });

    pieArcs.append("text")
    .attr("transform", function(d) {
        var pos = labelArc.centroid(d);
        var angle = (d.startAngle + d.endAngle) / 2 * (180 / Math.PI) - 90;
        //return "translate(" + pos[0] + "," + (pos[1] + 10) + ")";
        return "translate(" + pos[0] + "," + (pos[1] + 10) + ") rotate(" + angle + ")";
    })
    .attr("text-anchor", "middle")
    .style("font-size", "15px")
    .text(function(d) { return d.data.name; });

</script>
</body>
</html>
